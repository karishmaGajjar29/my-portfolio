<section id="education" class="section container">
  <p class="eyebrow">05 / CONTINUING TO GROW</p>
  <h2>A foundation <span class="muted">for what's next.</span></h2>
  <div class="education-grid">
    @for (item of data.education; track item.short) {
      <article class="education-card">
        <span class="degree-icon">{{ item.short }}</span>
        <div>
          <p class="education-date">{{ item.dates }}</p>
          <h3>{{ item.degree }}</h3>
          <p>{{ item.school }}</p>
        </div>
      </article>
    }
  </div>
  <app-languages />
</section>
